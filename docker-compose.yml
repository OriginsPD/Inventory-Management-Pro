services:
  db:
    image: postgres:15-alpine
    container_name: ims-pro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ims_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ims_password}
      POSTGRES_DB: ${POSTGRES_DB:-ims_pro_db}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ims_user} -d ${POSTGRES_DB:-ims_pro_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ims_pro_db_data:/var/lib/postgresql/data
    networks:
      - ims-net

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: dev
    container_name: ims-pro-server
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - server_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ims_user}:${POSTGRES_PASSWORD:-ims_password}@db:5432/${POSTGRES_DB:-ims_pro_db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-ims-pro-dev-only-auth-secret-change-before-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3002}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3001}
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
      SKIP_ENV_VALIDATION: "true"
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ims-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: ims-pro-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3002}
      SERVER_INTERNAL_URL: http://server:3002
      SKIP_ENV_VALIDATION: "true"
    ports:
      - "3001:3001"
    depends_on:
      - server
    networks:
      - ims-net

networks:
  ims-net:
    driver: bridge

volumes:
  ims_pro_db_data:
  server_node_modules:
  web_node_modules:
