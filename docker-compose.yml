services:
  db:
    image: postgres:15-alpine
    container_name: ims-pro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ims_pro_db_data:/var/lib/postgresql/data
    networks:
      - ims-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ims-pro-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./packages:/packages
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules
        - action: sync
          path: ./packages
          target: /packages
        - action: rebuild
          path: ./backend/package.json
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PORT=${PORT}
      - HOSTNAME=${HOSTNAME}
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ims-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ims-pro-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./packages:/packages
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: sync
          path: ./packages
          target: /packages
        - action: rebuild
          path: ./frontend/package.json
    environment:
      - VITE_API_URL=${VITE_API_URL}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - ims-net

networks:
  ims-net:
    driver: bridge

volumes:
  ims_pro_db_data:
