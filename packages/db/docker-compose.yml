name: ims_pro

services:
  postgres:
    image: postgres:18
    container_name: ims_pro-postgres
    environment:
      POSTGRES_DB: ims_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ims_pro_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ims_pro_postgres_data:
